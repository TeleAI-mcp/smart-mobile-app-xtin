name: Issue Label Automation

on:
  issues:
    types: [labeled]

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'documentation' || github.event.label.name == 'feature' || github.event.label.name == 'bug'
    steps:
      - name: Post comment based on label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = context.payload.label.name;
            let commentBody = '';
            
            if (label === 'documentation') {
              commentBody = 'Thank you for flagging this documentation issue. We will update it soon.';
            } else if (label === 'feature') {
              commentBody = 'Thank you for the feature request. We will consider including this in a future release.';
            } else if (label === 'bug') {
              commentBody = 'Thank you for reporting this bug. Our team will investigate and fix it.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
